<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Guide</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1b1f24; --muted:#5b6570; --line:#dfe3e8; --card:#f6f8fa;
    --accent:#2b5fd9; --accent-fg:#ffffff; --good:#1a7f4b; --warn:#9a6700; --bad:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14171b; --fg:#e6e9ed; --muted:#9aa4af; --line:#2a2f36; --card:#1b1f24;
      --accent:#7aa2ff; --accent-fg:#0d1117; --good:#56d364; --warn:#e3b341; --bad:#ff8b81;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14171b; --fg:#e6e9ed; --muted:#9aa4af; --line:#2a2f36; --card:#1b1f24;
    --accent:#7aa2ff; --accent-fg:#0d1117; --good:#56d364; --warn:#e3b341; --bad:#ff8b81;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:920px; margin:0 auto; padding:16px 16px 64px; }
  h1 { font-size:1.6rem; margin:.4rem 0 .2rem; }
  h2 { font-size:1.2rem; margin:1.6rem 0 .4rem; }
  h3 { font-size:1.05rem; }
  a { color:var(--accent); }
  code { background:var(--card); padding:1px 5px; border-radius:4px; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .note { background:var(--card); border-left:4px solid var(--accent); padding:10px 14px; border-radius:6px; margin:10px 0; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); margin:14px 0 16px; overflow-x:auto; }
  .tab { appearance:none; background:none; border:0; color:var(--muted); font:inherit; font-weight:600;
         padding:10px 10px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  .tab[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin:0 0 14px; }
  @media (min-width:640px) { .tiles { grid-template-columns:repeat(4, 1fr); } }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile b { display:block; font-size:1.8rem; line-height:1.1; }
  .tile span { color:var(--muted); font-size:.85rem; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .controls input, .controls select {
    font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; min-width:0; }
  .controls input { flex:1 1 200px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 10px; }
  .card.skip { opacity:.55; }
  .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .co { font-weight:700; }
  .chip { display:inline-block; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:99px;
          border:1px solid var(--line); color:var(--muted); }
  .chip.t1 { color:var(--good); border-color:var(--good); }
  .chip.t2 { color:var(--accent); border-color:var(--accent); }
  .role { display:block; margin:2px 0; font-weight:600; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:.88rem; }
  .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .btn { appearance:none; font:inherit; font-size:.85rem; font-weight:600; color:var(--fg); background:none;
         border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  .btn[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  details { margin-top:8px; color:var(--muted); font-size:.85rem; }
  summary { cursor:pointer; }
  .empty { color:var(--muted); padding:20px 0; text-align:center; }
  .grp { margin:0 0 18px; }
  .grp h3 { margin:0 0 6px; }
  .co-list { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 12px; font-size:.9rem; }
  .card input.note-in { width:100%; margin-top:8px; font:inherit; font-size:.9rem; color:var(--fg);
         background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .status-sel { font:inherit; font-size:.85rem; font-weight:600; color:var(--fg); background:var(--bg);
         border:1px solid var(--line); border-radius:8px; padding:4px 6px; }
  .add { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:0 0 12px; }
  .add summary { font-weight:600; color:var(--fg); }
  .add form { display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px; }
  @media (min-width:640px) { .add form { grid-template-columns:1fr 1fr; } .add form .wide { grid-column:1 / -1; } }
  .add input, .add select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
         border-radius:8px; padding:9px 10px; min-width:0; width:100%; }
  .btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn.danger { color:var(--bad); }
  .store { color:var(--muted); font-size:.8rem; margin:6px 0 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  {{BANNER}}
  <h1>Your job search</h1>
  <p class="sub">{{PROFILE}}</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-ranked" aria-selected="true" data-tab="ranked">Ranked list</button>
    <button class="tab" role="tab" id="tab-tracker" aria-selected="false" data-tab="tracker">Tracker</button>
    <button class="tab" role="tab" id="tab-universe" aria-selected="false" data-tab="universe">Companies</button>
    <button class="tab" role="tab" id="tab-method" aria-selected="false" data-tab="method">Method</button>
  </div>

  <section id="ranked">
    <div class="tiles" id="tiles"></div>
    <div class="controls">
      <input id="q" type="search" placeholder="Filter by company, role or location" aria-label="Filter">
      <select id="tier" aria-label="Tier"><option value="">All tiers</option></select>
      <select id="triage" aria-label="Status">
        <option value="">All statuses</option>
        <option value="none">Not triaged</option>
        <option value="apply">Apply</option>
        <option value="maybe">Maybe</option>
        <option value="skip">Skip</option>
      </select>
    </div>
    <p class="note"><strong>You review and submit every application yourself.</strong>
    Mark each posting Apply, Maybe or Skip after reading it. Your marks stay in this browser only.</p>
    <div id="list"></div>
  </section>

  <section id="tracker" hidden>
    <div class="tiles" id="ttiles"></div>
    <details class="add">
      <summary>Add an application</summary>
      <form id="addform">
        <input name="company" placeholder="Company" required aria-label="Company">
        <input name="role" placeholder="Role" required aria-label="Role">
        <input name="url" type="url" placeholder="Link to the posting (optional)" aria-label="Link">
        <select name="status" aria-label="Status"></select>
        <button class="btn primary wide" type="submit">Add</button>
      </form>
    </details>
    <div class="controls">
      <input id="tq" type="search" placeholder="Filter by company, role or status" aria-label="Filter applications">
      <select id="tstatus" aria-label="Status filter"><option value="">All statuses</option></select>
      <button class="btn" id="export" type="button">Export CSV</button>
    </div>
    <div id="tlist"></div>
    <p class="store" id="storeinfo"></p>
  </section>

  <section id="universe" hidden></section>

  <section id="method" hidden>
    {{PLAYBOOK}}
  </section>
</main>

<script type="application/json" id="data">{{DATA}}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('data').textContent);
  var ranked = data.ranked, companies = data.companies, statuses = data.statuses;
  var stageOf = {}; statuses.forEach(function (s) { stageOf[s.name] = s.stage; });
  var NS = data.profile.name || 'default';
  var MARKS_KEY = 'job-search-triage:' + NS;
  var marks = {};
  try { marks = JSON.parse(localStorage.getItem(MARKS_KEY) || '{}'); } catch (e) { marks = {}; }
  function saveMarks() { try { localStorage.setItem(MARKS_KEY, JSON.stringify(marks)); } catch (e) { /* storage unavailable */ } }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function newId() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- Application store: private artifact database, else this browser ----------
  var apps = [];
  var listeners = [];
  function notify() { listeners.forEach(function (f) { f(); }); }

  function localStore() {
    var KEY = 'job-search-apps:' + NS, SEEDED = KEY + ':seeded';
    var items = [];
    try { items = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { items = null; }
    if (!items) {
      var seeded = false;
      try { seeded = localStorage.getItem(SEEDED) === '1'; } catch (e) { seeded = false; }
      items = (data.demo && !seeded && data.seedApps) ? data.seedApps.slice() : [];
    }
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(SEEDED, '1'); } catch (e) { /* storage unavailable */ }
      apps = items.slice(); notify();
    }
    apps = items.slice();
    return {
      kind: 'This browser only. Clear site data and it is gone; use Export CSV to keep a copy.',
      save: function (a) {
        var i = items.findIndex(function (x) { return x.id === a.id; });
        if (i >= 0) items[i] = a; else items.push(a);
        persist(); return Promise.resolve();
      },
      remove: function (id) { items = items.filter(function (x) { return x.id !== id; }); persist(); return Promise.resolve(); }
    };
  }

  function dbStore(db, uid) {
    var col = db.collection('data/users/' + uid);   // private to this viewer, even from the owner
    var chain = Promise.resolve();
    function queue(fn) { chain = chain.then(fn).catch(function () { /* surfaced by the next snapshot */ }); return chain; }
    col.onSnapshot(function (snap) {
      apps = snap.docs.map(function (d) { return d.data(); }); notify();
    }, function () { /* terminal: keep what is on screen */ });
    return {
      kind: 'Saved in this page’s private database, so it survives reloads and devices.',
      save: function (a) { return queue(function () { return col.doc(a.id).set(a); }); },
      remove: function (id) { return queue(function () { return col.doc(id).delete(); }); }
    };
  }

  var store = localStore();
  async function upgradeStore() {
    try {
      if (!(window.claude && window.claude.use)) return;
      var db = await window.claude.use('db'), user = await window.claude.use('user');
      var uid = user ? await user.id() : null;
      if (db && uid) { store = dbStore(db, uid); render_store(); }
    } catch (e) { /* stay on browser storage */ }
  }
  function render_store() { document.getElementById('storeinfo').textContent = store.kind; }

  // ---------- Tabs ----------
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) {
        var on = x === t;
        x.setAttribute('aria-selected', on ? 'true' : 'false');
        document.getElementById(x.dataset.tab).hidden = !on;
      });
    });
  });

  function tile(box, value, label) {
    var t = el('div', 'tile'); t.appendChild(el('b', '', String(value))); t.appendChild(el('span', '', label)); box.appendChild(t);
  }

  // ---------- Ranked list ----------
  function rankedTiles() {
    var tier1 = ranked.filter(function (r) { return r.tier === 1; }).length;
    var marked = ranked.filter(function (r) { return marks[r.url] === 'apply'; }).length;
    var box = document.getElementById('tiles'); box.textContent = '';
    tile(box, ranked.length, 'Postings ranked'); tile(box, tier1, 'At tier 1 companies');
    tile(box, companies.length, 'Companies in universe'); tile(box, marked, 'Marked to apply');
  }

  var tierSel = document.getElementById('tier');
  Array.from(new Set(ranked.map(function (r) { return r.tier; }))).sort().forEach(function (t) {
    var o = el('option', '', 'Tier ' + t); o.value = String(t); tierSel.appendChild(o);
  });
  ['q', 'tier', 'triage'].forEach(function (id) { document.getElementById(id).addEventListener('input', renderRanked); });

  function addFromPosting(r) {
    if (apps.some(function (a) { return a.url && a.url === r.url; })) return;
    store.save({ id: newId(), company: r.company, role: r.title, url: r.url || '', status: 'To apply',
                 applied: '', note: '', history: [] });
  }

  function renderRanked() {
    var q = document.getElementById('q').value.toLowerCase();
    var tier = tierSel.value, tri = document.getElementById('triage').value;
    var list = document.getElementById('list'); list.textContent = '';
    var shown = ranked.filter(function (r) {
      var m = marks[r.url] || 'none';
      if (tier && String(r.tier) !== tier) return false;
      if (tri && m !== tri) return false;
      return !q || (r.company + ' ' + r.title + ' ' + (r.location || '')).toLowerCase().indexOf(q) >= 0;
    });
    if (!shown.length) list.appendChild(el('p', 'empty', 'No postings match these filters.'));
    shown.forEach(function (r) {
      var m = marks[r.url] || 'none';
      var card = el('div', 'card' + (m === 'skip' ? ' skip' : ''));
      var top = el('div', 'row');
      top.appendChild(el('span', 'co', r.company));
      top.appendChild(el('span', 'chip t' + r.tier, 'Tier ' + r.tier + ' · score ' + r.score));
      card.appendChild(top);
      var href = safeUrl(r.url), role;
      if (href) { role = el('a', 'role', r.title); role.href = href; role.rel = 'noopener'; role.target = '_blank'; }
      else role = el('span', 'role', r.title);
      card.appendChild(role);
      card.appendChild(el('div', 'meta', [r.location, r.posted_at].filter(Boolean).join(' · ')));
      var acts = el('div', 'actions');
      ['apply', 'maybe', 'skip'].forEach(function (k) {
        var b = el('button', 'btn', k.charAt(0).toUpperCase() + k.slice(1));
        b.type = 'button'; b.setAttribute('aria-pressed', m === k ? 'true' : 'false');
        b.addEventListener('click', function () {
          if (marks[r.url] === k) delete marks[r.url]; else { marks[r.url] = k; if (k === 'apply') addFromPosting(r); }
          saveMarks(); rankedTiles(); renderRanked();
        });
        acts.appendChild(b);
      });
      card.appendChild(acts);
      if (r.reasons && r.reasons.length) {
        var d = el('details'); d.appendChild(el('summary', '', 'Why this ranked here'));
        d.appendChild(el('div', '', r.reasons.join('; '))); card.appendChild(d);
      }
      list.appendChild(card);
    });
  }

  // ---------- Tracker ----------
  function fillStatusSelect(sel, current) {
    statuses.forEach(function (s) {
      var o = el('option', '', s.name); o.value = s.name; if (s.name === current) o.selected = true; sel.appendChild(o);
    });
  }
  fillStatusSelect(document.querySelector('#addform [name=status]'), 'To apply');
  fillStatusSelect(document.getElementById('tstatus'), '');

  function trackerTiles() {
    var box = document.getElementById('ttiles'); box.textContent = '';
    function n(stage) { return apps.filter(function (a) { return stageOf[a.status] === stage; }).length; }
    var sent = apps.filter(function (a) { return stageOf[a.status] !== 'planned'; }).length;
    tile(box, sent, 'Applications sent'); tile(box, n('planned'), 'To apply');
    tile(box, n('open') + n('won'), 'Active or offer'); tile(box, n('closed'), 'Closed');
  }

  function changeStatus(a, to) {
    var next = JSON.parse(JSON.stringify(a));
    next.history = (next.history || []).concat([{ at: today(), from: a.status, to: to }]);
    next.status = to;
    if (!next.applied && stageOf[to] !== 'planned') next.applied = today();
    store.save(next);
  }

  function renderTracker() {
    var q = document.getElementById('tq').value.toLowerCase(), st = document.getElementById('tstatus').value;
    var list = document.getElementById('tlist'); list.textContent = '';
    var order = {}; statuses.forEach(function (s, i) { order[s.name] = i; });
    var shown = apps.filter(function (a) {
      if (st && a.status !== st) return false;
      return !q || (a.company + ' ' + a.role + ' ' + a.status).toLowerCase().indexOf(q) >= 0;
    }).sort(function (x, y) { return (order[x.status] - order[y.status]) || String(y.applied).localeCompare(String(x.applied)); });
    if (!shown.length) list.appendChild(el('p', 'empty', apps.length ? 'No applications match these filters.' : 'Nothing tracked yet. Press Apply on a ranked posting, or add one above.'));
    shown.forEach(function (a) {
      var card = el('div', 'card' + (stageOf[a.status] === 'closed' ? ' skip' : ''));
      var top = el('div', 'row'); top.appendChild(el('span', 'co', a.company));
      var sel = el('select', 'status-sel'); sel.setAttribute('aria-label', 'Status of ' + a.company);
      fillStatusSelect(sel, a.status);
      sel.addEventListener('change', function () { changeStatus(a, sel.value); });
      top.appendChild(sel); card.appendChild(top);
      var href = safeUrl(a.url), role;
      if (href) { role = el('a', 'role', a.role); role.href = href; role.rel = 'noopener'; role.target = '_blank'; }
      else role = el('span', 'role', a.role);
      card.appendChild(role);
      card.appendChild(el('div', 'meta', a.applied ? 'Applied ' + a.applied : 'Not sent yet'));
      var note = el('input', 'note-in'); note.value = a.note || ''; note.placeholder = 'Note'; note.setAttribute('aria-label', 'Note for ' + a.company);
      note.addEventListener('change', function () { var next = JSON.parse(JSON.stringify(a)); next.note = note.value; store.save(next); });
      card.appendChild(note);
      var acts = el('div', 'actions');
      var del = el('button', 'btn danger', 'Delete'); del.type = 'button';
      del.addEventListener('click', function () { if (window.confirm('Delete ' + a.company + ' – ' + a.role + '?')) store.remove(a.id); });
      acts.appendChild(del); card.appendChild(acts);
      if (a.history && a.history.length) {
        var d = el('details'); d.appendChild(el('summary', '', 'Status history (' + a.history.length + ')'));
        d.appendChild(el('div', '', a.history.map(function (h) { return h.at + ': ' + h.from + ' → ' + h.to; }).join('; ')));
        card.appendChild(d);
      }
      list.appendChild(card);
    });
  }

  document.getElementById('addform').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, status = f.status.value;
    store.save({ id: newId(), company: f.company.value.trim(), role: f.role.value.trim(), url: f.url.value.trim(),
                 status: status, applied: stageOf[status] === 'planned' ? '' : today(), note: '', history: [] });
    f.reset(); f.status.value = 'To apply';
  });
  ['tq', 'tstatus'].forEach(function (id) { document.getElementById(id).addEventListener('input', renderTracker); });

  function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  document.getElementById('export').addEventListener('click', async function () {
    var rows = [['company', 'role', 'status', 'applied', 'url', 'note']].concat(apps.map(function (a) {
      return [a.company, a.role, a.status, a.applied, a.url, a.note]; }));
    var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\n');
    try {
      var dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: 'applications.csv', data: csv }); return; }
    } catch (e) { /* fall back to a normal download */ }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'applications.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });

  listeners.push(function () { trackerTiles(); renderTracker(); });

  // ---------- Companies ----------
  function universe() {
    var box = document.getElementById('universe');
    box.appendChild(el('p', 'sub', 'Your employer universe, best tier first. Edit companies.csv to change it.'));
    var byTier = {};
    companies.forEach(function (c) { (byTier[c.tier] = byTier[c.tier] || []).push(c); });
    Object.keys(byTier).sort().forEach(function (t) {
      var g = el('div', 'grp'); g.appendChild(el('h3', '', 'Tier ' + t));
      var l = el('div', 'co-list');
      byTier[t].forEach(function (c) { var p = el('span', 'pill', c.company); p.title = c.bucket || ''; l.appendChild(p); });
      g.appendChild(l); box.appendChild(g);
    });
  }

  rankedTiles(); renderRanked(); universe(); trackerTiles(); renderTracker(); render_store();
  upgradeStore();
})();
</script>
</body>
</html>
